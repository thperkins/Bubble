<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<title>Investor Portal | Bubble</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
  <h2>Investor Access</h2>
  <form id="accessForm">
    <input name="name" placeholder="Full Name" required><br>
    <input name="email" type="email" placeholder="Email" required><br>
    <label><input type="checkbox" required>
      I acknowledge that the following information is confidential.
    </label><br>
    <button type="submit">Request Access</button>
  </form>
  <p id="msg"></p>

  <script>
  document.getElementById('accessForm').addEventListener('submit', async e => {
    e.preventDefault();
    const data = new FormData(e.target);
  
    // no JSON; use URL-encoded body so browser skips the CORS pre-flight
    const res = await fetch('https://script.google.com/macros/s/AKfycbwxEVCQQQAAohMELVrwnJCjmztzWAR7_042ycv5G7LPn7nia2Zen7bI6CocDX802LGn/exec', {
      method: 'POST',
      body: new URLSearchParams(data)
    });
  
    document.getElementById('msg').textContent =
      res.ok ? "Check your email for your unique access link." :
               "Submission failed. Try again.";
  });
  </script>
</body>
</html>
