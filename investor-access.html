<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex,nofollow">
  <title>Investor Portal | Bubble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bubble - Building our ductile energy system with strategic long-duration energy storage.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHDVE67974"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LHDVE67974');
  </script>
</head>
<body>
  <h2>Investor Access</h2>
  <form id="accessForm">
    <input name="name" placeholder="Full Name" required><br>
    <input name="email" type="email" placeholder="Email" required><br>
    <label><input type="checkbox" required>
      I acknowledge that the following information is confidential.
    </label><br>
    <button type="submit">Request Access</button>
  </form>
  <p id="msg"></p>

  <script>
  document.getElementById('accessForm').addEventListener('submit', async e => {
    e.preventDefault();
    const data = new FormData(e.target);
  
    // no JSON; use URL-encoded body so browser skips the CORS pre-flight
    const res = await fetch('https://script.google.com/macros/s/AKfycbzY8hwb_rkTE1RWrklJci_XfprooivtKr4E5YkmWu2QNXYmlr-6wgeWrpGGA0F21fqT/exec', {
      method: 'POST',
      body: new URLSearchParams(data)
    });
  
    document.getElementById('msg').textContent =
      res.ok ? "Check your email for your unique access link." :
               "Submission failed. Try again.";
  });
  </script>
</body>
</html>
