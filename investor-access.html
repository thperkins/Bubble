<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<title>Investor Portal | Bubble</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
  <h2>Investor Access</h2>
  <form id="accessForm">
    <input name="name" placeholder="Full Name" required><br>
    <input name="email" type="email" placeholder="Email" required><br>
    <label><input type="checkbox" required>
      I acknowledge that the following information is confidential.
    </label><br>
    <button type="submit">Request Access</button>
  </form>
  <p id="msg"></p>

  <script>
  document.getElementById('accessForm').addEventListener('submit', async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const res = await fetch('https://script.google.com/macros/s/AKfycbwEqh6LCOxLjrsL-y_B5n3g31DuKDgga6dbWc57a_ZKUx-JuxPNkeLzNQVuT0VD8jGh/exec', {
      method: 'POST',
      mode: 'cors',
      body: JSON.stringify(data),
      headers: {'Content-Type': 'application/json'}
    });
    document.getElementById('msg').textContent =
      res.ok ? "Check your email for your unique access link." :
               "Submission failed. Try again.";
  });
  </script>
</body>
</html>
