<head>
  <meta name="robots" content="noindex,nofollow">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bubble - Building our ductile energy system with strategic long-duration energy storage.">

  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#ffffff">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHDVE67974"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LHDVE67974');

</head>
<style>
/* inline extras for fade + centering */
#content {
  text-align: center;
  width: 100%;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 1s ease, transform 1s ease;
}
#content.visible {
  opacity: 1;
  transform: translateY(0);
}
.spinner {
  width: 48px;
  height: 48px;
  border: 3px solid rgba(0,0,0,0.1);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 2em auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
ul { list-style: none; padding: 0; }
ul li { margin: 0.6em 0; }
</style>
</head>
<body>
<canvas id="bubbles"></canvas>

<main>
  <div id="content">
    <h1>Validating access…</h1>
    <div class="spinner"></div>
  </div>
</main>

<script>
(async () => {
  const content = document.getElementById('content');
  content.classList.add('visible');

  const t = new URLSearchParams(window.location.search).get('t');
  if (!t) {
    content.innerHTML = "<h2>Access denied — missing token.</h2>";
    return;
  }

  try {
    // wait 3 seconds to show animation elegantly
    await new Promise(r => setTimeout(r, 1500));

    const res = await fetch('https://script.google.com/macros/s/AKfycbzY8hwb_rkTE1RWrklJci_XfprooivtKr4E5YkmWu2QNXYmlr-6wgeWrpGGA0F21fqT/exec?t=' + encodeURIComponent(t));
    const result = await res.json();
    
    if (result.status === "valid") {
      const name = result.name || "Investor";
      content.innerHTML = `
        <h1>Welcome, ${name}</h1>
        <p>Access granted. Below you’ll find a curated set of materials introducing the <strong>Bubble High-Temperature Compressed-Air Energy Storage System</strong>.</p>
        <section style="text-align:left;margin-top:2.5em;">
          <h2>Key Materials</h2>
          <ul>
            <li><a href="/files/Bubble_Investor_Deck.pdf" target="_blank">Investor Deck — Market & Technical Overview (PDF)</a></li>
            <li><a href="/files/TRL_Plan.pdf" target="_blank">TRL Development Plan (PDF)</a></li>
            <li><a href="/files/Bubble_Economics_Summary.pdf" target="_blank">Techno-Economic Summary (PDF)</a></li>
          </ul>

          <h2>Highlights</h2>
          <ul>
            <li>100 MWh per system</li>
            <li>200 bar @ 1050 °C high-temperature storage</li>
            <li>Round-trip efficiency ≈ 70 %</li>
            <li>Projected lifetime > 40 years, negligible degradation</li>
            <li>CAPEX target &lt; €80 / kWh (installed)</li>
          </ul>

          <h2>Next Milestones</h2>
          <p>Prototype test campaign at TNO Rijswijk facility (TRL 6) planned for 2026, followed by scale-up to 100 MWh demonstration site.  
          Capital partners and strategic collaborators are now being shortlisted.</p>

          <p><a href="mailto:hello@bubble.engineering">Contact the team</a> to discuss partnership or investment opportunities.</p>
        </section>
      `;
      content.classList.add('visible');
    } else if (txt.startsWith("error")) {
      content.innerHTML = "<h2>Server error. Please try again later.</h2>";
    } else {
      content.innerHTML = "<h2>Access denied or link expired.</h2>";
    }
  } catch (err) {
    content.innerHTML = "<h2>Network error — please check your connection.</h2>";
  }
})();
</script>


</body>
</html>
