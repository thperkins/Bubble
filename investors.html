<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<title>Investor Portal | Bubble</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
<div id="content">Validating access…</div>
<script>
(async()=>{
  const t = new URLSearchParams(window.location.search).get('t');
  if(!t) return document.body.textContent="Access denied.";
  const res = await fetch('https://script.google.com/macros/s/AKfycbwEqh6LCOxLjrsL-y_B5n3g31DuKDgga6dbWc57a_ZKUx-JuxPNkeLzNQVuT0VD8jGh/exec?t='+t, {
    mode: 'cors'
  });
  const txt = await res.text();
  if(txt==="valid"){
    document.getElementById('content').innerHTML=`
      <h1>Bubble Investor Materials</h1>
      <p>Confidential — not for distribution.</p>
      <ul>
        <li><a href="/files/Bubble_Investor_Deck.pdf">Investor Deck (PDF)</a></li>
        <li><a href="/files/TRL_Plan.pdf">TRL Plan</a></li>
      </ul>`;
  }else{
    document.body.textContent="Access denied or link expired.";
  }
})();
</script>
</body>
</html>
